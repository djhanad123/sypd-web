<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="diasporaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006699" />
      <stop offset="100%" stop-color="#4189DD" />
    </linearGradient>
  </defs>
  <!-- Globe & Network Icon -->
  <g transform="translate(15, 15)">
    <!-- Globe Circle -->
    <circle cx="65" cy="65" r="58" fill="url(#diasporaGrad)" opacity="0.1" stroke="#4189DD" stroke-width="3" />
    <!-- Lat/Long arcs -->
    <ellipse cx="65" cy="65" rx="30" ry="58" fill="none" stroke="#4189DD" stroke-width="2" opacity="0.6" stroke-dasharray="4 2" />
    <line x1="7" y1="65" x2="123" y2="65" stroke="#4189DD" stroke-width="2" opacity="0.6" />
    <ellipse cx="65" cy="65" rx="58" ry="24" fill="none" stroke="#4189DD" stroke-width="2" opacity="0.6" stroke-dasharray="4 2" />
    <!-- Central Somali Star -->
    <polygon points="65,36 71,52 87,52 74,62 79,78 65,68 51,78 56,62 43,52 59,52" fill="#4189DD" />
    <!-- Network nodes -->
    <circle cx="28" cy="38" r="5" fill="#F36C21" />
    <circle cx="102" cy="38" r="5" fill="#F36C21" />
    <circle cx="105" cy="92" r="5" fill="#F36C21" />
    <circle cx="25" cy="92" r="5" fill="#F36C21" />
    <line x1="28" y1="38" x2="65" y2="52" stroke="#F36C21" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="102" y1="38" x2="65" y2="52" stroke="#F36C21" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="105" y1="92" x2="65" y2="78" stroke="#F36C21" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="25" y1="92" x2="65" y2="78" stroke="#F36C21" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>
  <!-- Typography -->
  <text x="160" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#003366" letter-spacing="-0.5">SOMALI DIASPORA</text>
  <text x="160" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#F36C21" letter-spacing="1.5">GLOBAL ALLIANCE</text>
  <text x="160" y="118" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.5">HUMANITARIAN PARTNERSHIP</text>
</svg>
